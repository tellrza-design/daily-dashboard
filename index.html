<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>오늘 관제판</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="오늘 관제판" />
<meta name="application-name" content="오늘 관제판" />
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-180.png" type="image/png" />
<meta name="format-detection" content="telephone=no" />
<meta name="description" content="오늘의 발행 미션·문안 원터치 복사·스레드 답글·10분 식단·채널 현황·집중 타이머를 한 화면에서." />
<style>
  :root {
    --bg: #F6F7F9;
    --page: #E5E8EB;
    --card: #FFFFFF;
    --text: #191F28;
    --sub: #6B7684;
    --line: #ECEEF2;
    --blue: #3182F6;
    --blue-soft: #EBF3FE;
    --orange: #FF7A30;
    --orange-soft: #FFF1E8;
    --green: #16A34A;
    --green-soft: #DCFCE7;
    --red: #DC2626;
    --red-soft: #FEE2E2;
    --amber: #D97706;
    --amber-soft: #FEF3C7;
    --done-bg: #F9FAFB;
    --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    --toast-bg: #191F28;
    --toast-text: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101318;
      --page: #07090C;
      --card: #191D24;
      --text: #F2F4F6;
      --sub: #9AA4B2;
      --line: #262C35;
      --blue: #4C8DFF;
      --blue-soft: #16233A;
      --orange: #FF8A4C;
      --orange-soft: #2A1D15;
      --green: #4ADE80;
      --green-soft: #132A1C;
      --red: #F87171;
      --red-soft: #2C1618;
      --amber: #FBBF24;
      --amber-soft: #2B2211;
      --done-bg: #14181E;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
      --toast-bg: #F2F4F6;
      --toast-text: #191F28;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s ease;
  }
  .phone {
    width: 100%;
    max-width: 390px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));
    position: relative;
  }

  /* ── 헤더 ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .date-badge {
    font-size: 12px;
    font-weight: 700;
    color: var(--blue);
    background: var(--blue-soft);
    padding: 4px 10px;
    border-radius: 999px;
    display: inline-block;
    margin-bottom: 7px;
  }
  .title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 0;
    line-height: 1.25;
  }
  .weather {
    text-align: right;
    background: var(--card);
    padding: 8px 12px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    border: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    flex-shrink: 0;
    min-width: 78px;
  }
  .weather:active { transform: scale(0.97); }
  .weather-temp { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .weather-loc { font-size: 11px; color: var(--sub); margin-top: 2px; font-weight: 600; }

  /* ── 브리핑 배너 ── */
  .briefing {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, var(--blue-soft), var(--card) 72%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 11px 12px 11px 14px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .briefing-main { flex: 1; min-width: 0; }
  .briefing-head {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 800;
    color: var(--blue);
    margin-bottom: 4px;
    letter-spacing: -0.1px;
  }
  .briefing-time {
    font-weight: 700;
    color: var(--sub);
    background: var(--bg);
    padding: 1px 7px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .briefing-text {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.45;
    letter-spacing: -0.25px;
    word-break: keep-all;
  }
  .sync-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--sub);
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: inherit;
    transition: transform .2s ease;
  }
  .sync-btn:active { transform: scale(0.94); }
  .sync-btn.spin { animation: spin .7s linear; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ── 카드 ── */
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }
  .card-title { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; }
  .hint { font-size: 12px; color: var(--sub); font-weight: 600; }
  .progress-pill {
    font-size: 12px;
    font-weight: 800;
    color: var(--orange);
    background: var(--orange-soft);
    padding: 3px 9px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .progress-bar {
    height: 7px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--blue), var(--orange));
    border-radius: 999px;
    transition: width .35s cubic-bezier(.4, 0, .2, 1);
  }

  /* ── 미션 ── */
  .mission {
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
    transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .mission:last-child { margin-bottom: 0; }
  .mission.done { background: var(--done-bg); border-color: var(--blue-soft); }
  .mission.next { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .mission-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 12px;
    width: 100%;
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    min-height: 54px;
    transition: transform .12s ease, opacity .2s ease;
  }
  .mission-main:active { transform: scale(0.985); }
  .mission-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 2px solid #D1D6DB;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .mission.done .check-box { background: var(--blue); border-color: var(--blue); }
  .mission-name { display: block; font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
  .mission.done .mission-name { color: var(--sub); text-decoration: line-through; }
  .mission-time { display: block; font-size: 12px; color: var(--sub); font-weight: 600; margin-top: 3px; }
  .stamp {
    font-size: 11px;
    font-weight: 800;
    color: var(--orange);
    border: 1.5px solid var(--orange);
    padding: 2px 7px;
    border-radius: 6px;
    transform: rotate(-6deg);
    display: none;
    flex-shrink: 0;
  }
  .mission.done .stamp { display: inline-block; }
  .next-badge {
    display: none;
    font-size: 11px;
    font-weight: 800;
    color: var(--blue);
    background: var(--blue-soft);
    padding: 3px 8px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .mission.next .next-badge { display: inline-block; }
  .mission.done .next-badge { display: none; }

  /* ── 미션 미니 버튼 ── */
  .mission-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
    padding: 0 12px 10px;
  }
  .mission-actions:empty { display: none; padding: 0; }
  .mini-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--sub);
    border-radius: 9px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: -0.2px;
    font-family: inherit;
    min-height: 32px;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: transform .1s ease, background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .mini-btn:active { transform: scale(0.96); }
  .mini-btn.copy { color: var(--blue); background: var(--blue-soft); border-color: var(--blue-soft); }
  .mini-btn.copy.copied { color: var(--green); background: var(--green-soft); border-color: var(--green-soft); }
  .mini-btn.open { color: var(--text); }

  /* ── 핵심 체크 ── */
  .alert-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.2px;
    cursor: pointer;
    min-height: 44px;
  }
  .alert-row:last-child { border-bottom: none; padding-bottom: 0; }
  .alert-row:first-of-type { padding-top: 2px; }
  .alert-row .label { flex: 1; min-width: 0; }
  .alert-row.checked .label { color: var(--sub); text-decoration: line-through; }
  .tag {
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 8px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .tag-red { background: var(--red-soft); color: var(--red); }
  .tag-amber { background: var(--amber-soft); color: var(--amber); }
  .tag-green { background: var(--green-soft); color: var(--green); }
  .tag-blue { background: var(--blue-soft); color: var(--blue); }
  .dot-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #D1D6DB;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: #fff;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .alert-row.checked .dot-check { background: var(--green); border-color: var(--green); }

  /* ── 작업실 바로가기 ── */
  .shortcut-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .shortcut {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 48px;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: var(--text);
    text-decoration: none;
    transition: transform .1s ease, border-color .2s ease;
  }
  .shortcut:active { transform: scale(0.97); border-color: var(--blue-soft); }
  .shortcut .sc-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shortcut .sc-arrow { margin-left: auto; color: var(--sub); font-size: 12px; font-weight: 800; flex-shrink: 0; }

  /* ── 타이머 ── */
  .timer-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }
  .timer-display {
    font-size: 34px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    line-height: 1;
  }
  .timer-display.ending { color: var(--orange); }
  .timer-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    min-height: 38px;
    transition: transform .1s ease, opacity .2s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-ghost { background: var(--bg); color: var(--sub); }
  .presets { display: flex; gap: 6px; }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--sub);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    transition: all .15s ease;
  }
  .chip.active { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }
  .chip:active { transform: scale(0.96); }
  .timer-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  /* ── 스레드 소통 10초 컷 ── */
  .reply {
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .reply:last-child { margin-bottom: 0; }
  .reply.done { background: var(--done-bg); border-color: var(--green-soft); }
  .reply-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 11px 12px 9px;
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    min-height: 42px;
  }
  .reply-head:active { transform: scale(0.99); }
  .reply-topic {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -0.2px;
    line-height: 1.4;
    word-break: keep-all;
  }
  .reply.done .reply-topic { color: var(--sub); }
  .reply .dot-check { width: 18px; height: 18px; }
  .reply.done .dot-check { background: var(--green); border-color: var(--green); }
  .reply-actions { display: flex; gap: 6px; padding: 0 12px 10px; }
  .reply-actions .mini-btn { flex: 1; justify-content: center; text-align: center; }

  /* ── 10분 식단 · 레시피 아코디언 ── */
  .dinner-head {
    display: block;
    width: 100%;
    padding: 0;
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .dinner-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 9px;
  }
  .dinner-badge {
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--orange-soft);
    color: var(--orange);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .dinner-row { display: flex; align-items: center; gap: 8px; }
  .dinner-menu {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: -0.25px;
    line-height: 1.4;
    word-break: keep-all;
  }
  .dinner-caret {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 800;
    color: var(--blue);
    background: var(--blue-soft);
    padding: 5px 9px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .dinner-steps {
    max-height: 0;
    overflow: hidden;
    transition: max-height .32s cubic-bezier(.4, 0, .2, 1);
  }
  .dinner-steps ol {
    list-style: none;
    counter-reset: step;
    margin: 12px 0 0;
    padding: 12px 0 0;
    border-top: 1px solid var(--line);
  }
  .dinner-steps li {
    counter-increment: step;
    position: relative;
    padding-left: 27px;
    margin-bottom: 9px;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: -0.2px;
    word-break: keep-all;
  }
  .dinner-steps li:last-child { margin-bottom: 0; }
  .dinner-steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 1px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--blue-soft);
    color: var(--blue);
    font-size: 11px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── 미니 현황판 ── */
  .board-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .board-row:first-child { padding-top: 1px; }
  .board-row:last-child { border-bottom: none; padding-bottom: 0; }
  .board-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .board-label {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.2px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .board-value {
    font-size: 12px;
    font-weight: 800;
    color: var(--sub);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .board-value.pill { font-size: 11px; padding: 3px 8px; border-radius: 8px; }
  .board-value.pill-red { background: var(--red-soft); color: var(--red); }
  .board-value.pill-amber { background: var(--amber-soft); color: var(--amber); }
  .board-value.pill-green { background: var(--green-soft); color: var(--green); }
  .board-value.pill-blue { background: var(--blue-soft); color: var(--blue); }
  .board-bar {
    height: 6px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
  }
  .board-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--blue), var(--orange));
    transition: width .5s cubic-bezier(.4, 0, .2, 1);
  }

  /* ── 토스트 ── */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translate(-50%, 130%);
    width: min(358px, calc(100% - 32px));
    background: var(--toast-bg);
    color: var(--toast-text);
    font-size: 12.5px;
    font-weight: 700;
    padding: 12px 14px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: transform .3s cubic-bezier(.2, .9, .3, 1.2), opacity .25s ease;
    box-shadow: 0 8px 26px rgba(0, 0, 0, .22);
    z-index: 50;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast-sign { color: #FF9F68; font-weight: 800; flex-shrink: 0; }

  /* ── 축하 파티클 ── */
  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 40;
  }
  .confetti i {
    position: absolute;
    top: -12px;
    width: 7px;
    height: 11px;
    border-radius: 2px;
    animation: fall 1.6s cubic-bezier(.3, .7, .5, 1) forwards;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(520deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .confetti { display: none; }
    .toast, .progress-fill, .mission, .mission-main, .check-box, .sync-btn { transition: none; }
    .sync-btn.spin { animation: none; }
  }
</style>
</head>
<body>
  <main class="phone">
    <div class="header">
      <div>

<script>
(function () {
  'use strict';

  /* ───── 설정 ───── */
  var CONFIG = {

    timerPresets: [25, 10, 5]
  };

  /* 네트워크 실패 시 화면에 그릴 내장 fallback (data.json 과 같은 구조) */
  var FALLBACK = {
    date_label: '11월 16일 월요일',
    updated_at: '17:10 기준',
    briefing: '18:20 인스타 감성 릴스 · 18:30 1인 식단 브리핑 대기 중',
    missions: [
      {
        id: 'm1',
        title: '🧵 스레드 점심 공감',

        app_label: '스레드',
        app_url: 'https://www.threads.com/',
        copy_text: '월요일 오전은 유독 마음이 급해진다. 주말 사이에 밀린 일들과 새로 시작되는 한 주 앞에서 괜히 남들보다 한 걸음 뒤처진 기분이 들기 때문이다. 하지만 조급한 마음으로 뱉은 말은 쉽게 거칠어지고, 서둘러 내린 결정은 꼭 빈틈을 남긴다. 오늘 점심 이후에는 무슨 일이든 딱 반 박자만 늦춰 보려 한다. 대답하기 전에 숨을 한 번 고르고, 조금 천천히 가도 내 자리는 없어지지 않는다고 믿어 보는 것이다. 바쁜 하루일수록 마음의 속도까지 세상에 맞춰 달릴 필요는 없다.'
      },
      {
        id: 'm2',
        title: '🎬 인스타 감성 릴스',
        time: '18:30',
        app_label: '인스타',
        app_url: 'https://www.instagram.com/',
        copy_text: ''
      },
      {
        id: 'm3',
        title: '📸 인스타 캐러셀 Vol.10',
        time: '20:30',
        app_label: '인스타',
        app_url: 'https://www.instagram.com/',
        copy_text: '[마음정원 에디토리얼 · 10일차]\n\n살다 보면 사소한 대화에서도\n은근한 승부를 겨루고 있을 때가 있습니다.\n누가 더 옳은지, 누가 더 앞섰는지 증명하려 애쓸수록\n가장 먼저 지치고 상처받는 건 결국 나 자신입니다.\n\n노자는 『도덕경』에서\n세상에서 가장 강한 힘은 \'물\'과 같다고 말했습니다.\n\n“상선약수(上善若水),\n가장 높은 선은 물과 같다.\n물은 만물을 이롭게 하면서도 다투지 않는다.”\n\n물은 남들이 꺼리는 낮은 곳으로 흐르기를 마다하지 않고,\n단단한 바위를 만나면 부수려 들지 않고 조용히 돌아갑니다.\n하지만 시간이 흐른 뒤, 그 바위를 깎아 길을 내는 것도\n결국 부드러운 물입니다.\n\n오늘 하루, 굳이 이겨서 확인받지 않아도 되는 일에는\n주먹 쥔 손을 살짝 풀어 보세요.\n다투지 않기에, 세상은 당신을 결코 이길 수 없습니다.\n\n요즘 당신이 ‘굳이 이기지 않아도 되는데’ 에너지를 쓰고 있는 일이 있나요? 댓글로 편하게 나눠 주세요. 🌊\n\n#마음정원 #노자 #도덕경 #상선약수 #인생글귀'
      },
      {
        id: 'm4',
        title: '🌙 스레드 심야 사유 7일차',
        time: '21:00',
        app_label: '스레드',
        app_url: 'https://www.threads.com/',
        copy_text: ''
      }
    ],
    threads_replies: [
      {
        id: 'tr1',
        topic: '인생책 · 카네기 & 군주론',
        url: 'https://www.threads.com/@jin___blanc/post/DSLFUuFk6g5',
        reply_text: '삶의 자리와 고민의 무게가 달라질 때마다 곁에 두게 되는 책도 함께 바뀐다는 말에 깊이 공감한다. 20대엔 사람과 마음을 배우고, 책임을 짊어질수록 구조와 본질을 묻는 고전을 찾게 되는 것 같다. 🗝️'
      },
      {
        id: 'tr2',
        topic: '독서 · 문해력과 인생책',
        url: 'https://www.threads.com/@clever.child_/post/DcaqXlPmp-W',
        reply_text: '문해력이라는 게 단순히 글자를 빨리 읽는 힘이 아니라, 결국 한 문장 너머의 맥락과 사람의 마음을 읽어내는 힘이라는 생각이 든다. 인생을 바꿔준 책 한 권이 그 모든 시선의 출발점이 되어주는 것 같다. 📓'
      }
    ],
    dinner: {
      menu: '18:30 저녁 메뉴 브리핑 대기',
      prep_time: '10분 컷',
      steps: ['18:30 식단 브리핑이 도착하면 여기에 딱 3줄 원팬 레시피가 자동으로 채워집니다.']
    },
    status_board: [
      { label: '🪷 연꽃세상 수익창출', value: '1,887 / 4,000h', progress: 47 },
      { label: '🛒 모모상점 재고', value: '품절 1건 확인', tone: 'red' },
      { label: '🎁 쿠팡 체험단', value: '격주 월 10시 / 16시', tone: 'blue' },
      { label: '🎨 미리캔버스 허브', value: '심사 9건 · 주간 56회', tone: 'amber' }
    ],
    checks: [
      { id: 'c1', emoji: '🛒', label: '모모상점 품절 건 확인', tag: '1개 품절', tone: 'red' },
      { id: 'c2', emoji: '💰', label: '정산 보류 건 회신 확인', tag: '회신 대기', tone: 'amber' },
      { id: 'c3', emoji: '☕', label: '카페 창업 사전 상담 준비', tag: '준비 완료', tone: 'green' }
    ],
    shortcuts: [
      { id: 's1', label: '💬 슬랙', url: 'https://autotell.slack.com/archives/C0APZQ4UWRF' },
      { id: 's2', label: '🎨 미리캔버스', url: 'https://www.miricanvas.com/' },
      { id: 's3', label: '🛒 쿠팡 WING', url: 'https://wing.coupang.com/' },
      { id: 's4', label: '▶️ 유튜브 스튜디오', url: 'https://studio.youtube.com/' }
    ]
  };

  var DATA = FALLBACK;
  var STORE = 'today-board.v1';
  var WEATHER_STORE = 'today-board.weather.v1';
  var DAYS = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var str = function (v) { return typeof v === 'string' ? v : ''; };

  function dateKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /* ───── data.json 정규화 ───── */
  function normalize(raw) {
    if (!raw || !Array.isArray(raw.missions) || raw.missions.length === 0) return null;
    var missions = raw.missions.map(function (m, i) {
      return {
        id: str(m.id) || ('m' + (i + 1)),
        title: str(m.title),
        time: str(m.time),
        app_label: str(m.app_label),
        app_url: str(m.app_url),
        copy_text: str(m.copy_text)
      };
    }).filter(function (m) { return m.title; });
    if (!missions.length) return null;

    var checks = Array.isArray(raw.checks) ? raw.checks.map(function (c, i) {
      var tone = str(c.tone);
      if (['red', 'amber', 'green', 'blue'].indexOf(tone) < 0) tone = 'blue';
      return {
        id: str(c.id) || ('c' + (i + 1)),
        emoji: str(c.emoji),
        label: str(c.label),
        tag: str(c.tag),
        tone: tone
      };
    }).filter(function (c) { return c.label; }) : [];

    var shortcuts = Array.isArray(raw.shortcuts) ? raw.shortcuts.map(function (s, i) {
      return {
        id: str(s.id) || ('s' + (i + 1)),
        label: str(s.label),
        url: str(s.url)
      };
    }).filter(function (s) { return s.label && /^https?:\/\//i.test(s.url); }) : [];

    var replies = Array.isArray(raw.threads_replies) ? raw.threads_replies.map(function (r, i) {
      return {
        id: str(r.id) || ('tr' + (i + 1)),
        topic: str(r.topic),
        url: str(r.url),
        reply_text: str(r.reply_text)
      };
    }).filter(function (r) { return r.topic && r.reply_text; }) : [];

    var dinner = null;
    if (raw.dinner && typeof raw.dinner === 'object') {
      var steps = Array.isArray(raw.dinner.steps) ? raw.dinner.steps.map(str).filter(function (v) { return v; }) : [];
      if (str(raw.dinner.menu)) {
        dinner = { menu: str(raw.dinner.menu), prep_time: str(raw.dinner.prep_time), steps: steps };
      }
    }

    var board = Array.isArray(raw.status_board) ? raw.status_board.map(function (b, i) {
      var tone = str(b.tone);
      if (['red', 'amber', 'green', 'blue'].indexOf(tone) < 0) tone = '';
      var progress = null;
      var rawP = b.progress;
      if (rawP !== null && rawP !== undefined && rawP !== '' && isFinite(Number(rawP))) {
        progress = Math.max(0, Math.min(100, Math.round(Number(rawP))));
      }
      return {
        id: str(b.id) || ('b' + (i + 1)),
        label: str(b.label),
        value: str(b.value),
        tone: tone,
        progress: progress
      };
    }).filter(function (b) { return b.label && b.value; }) : [];

    return {
      date_label: str(raw.date_label),
      updated_at: str(raw.updated_at),
      briefing: str(raw.briefing),
      missions: missions,
      threads_replies: replies,
      dinner: dinner,
      status_board: board,
      checks: checks,
      shortcuts: shortcuts
    };
  }

  function loadData(isManual) {
    var url = './data.json?t=' + Date.now();
    return fetch(url, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (json) {
        var clean = normalize(json);
        if (!clean) throw new Error('unexpected data shape');
        return clean;
      })
      .catch(function (err) {
        if (isManual) toast('⚠️ 최신 데이터를 못 읽었습니다. 내장 데이터로 표시합니다', 3200);
        return null;
      });
  }

  /* ───── 저장 ───── */
  var state = freshState();

  function freshState() {
    return { date: dateKey(), done: {}, checks: {}, replies: {}, timerEnded: 0 };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE);
      var saved = raw ? JSON.parse(raw) : null;
      // 날짜가 바뀌면 자동 초기화 (다음 날 첫 실행 시)
      if (saved && saved.date === dateKey()) {
        state = {
          date: saved.date,
          done: saved.done || {},
          checks: saved.checks || {},
          replies: saved.replies || {},
          timerEnded: saved.timerEnded || 0
        };
      } else {
        state = freshState();
      }
    } catch (e) {
      state = freshState();
    }
    save();
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  /* ───── 날짜 표시 ─────
     data.json 의 date_label 이 오늘 날짜와 맞으면 그 표기를 쓰고,
     아니면 오늘 날짜를 직접 계산해 보여준다(오래된 라벨 방지). */
  function renderDate() {
    var d = new Date();
    var computed = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + DAYS[d.getDay()];
    var label = computed;
    var m = /(\d{1,2})\s*월\s*(\d{1,2})\s*일/.exec(DATA.date_label || '');
    if (m && parseInt(m[1], 10) === d.getMonth() + 1 && parseInt(m[2], 10) === d.getDate()) {
      label = DATA.date_label;
    }
    $('dateBadge').textContent = label;
  }

  /* ───── 브리핑 배너 ───── */
  function renderBriefing() {
    $('briefingText').textContent = DATA.briefing || '오늘의 브리핑이 아직 없습니다';
    $('updatedAt').textContent = DATA.updated_at || '동기화 대기';
    $('briefing').style.display = '';
  }

  /* ───── 날씨 (Open-Meteo, 실패하면 조용히 대구 표시 유지) ───── */
  var WMO = {
    0: ['☀️', '맑음'], 1: ['🌤', '대체로 맑음'], 2: ['⛅️', '구름 조금'], 3: ['☁️', '흐림'],
    45: ['🌫', '안개'], 48: ['🌫', '안개'], 51: ['🌦', '약한 이슬비'], 53: ['🌦', '이슬비'], 55: ['🌧', '이슬비'],
    56: ['🌧', '얼어붙는 비'], 57: ['🌧', '얼어붙는 비'], 61: ['🌦', '약한 비'], 63: ['🌧', '비'], 65: ['🌧', '강한 비'],
    66: ['🌧', '얼어붙는 비'], 67: ['🌧', '얼어붙는 비'], 71: ['🌨', '약한 눈'], 73: ['🌨', '눈'], 75: ['❄️', '강한 눈'],
    77: ['🌨', '싸락눈'], 80: ['🌦', '소나기'], 81: ['🌧', '소나기'], 82: ['⛈', '강한 소나기'],
    85: ['🌨', '눈 소나기'], 86: ['❄️', '강한 눈 소나기'], 95: ['⛈', '뇌우'], 96: ['⛈', '뇌우·우박'], 99: ['⛈', '뇌우·우박']
  };

  function paintWeather(temp, code, subLabel) {
    var w = WMO[code] || ['🌡', ''];
    $('weatherTemp').textContent = w[0] + ' ' + Math.round(temp) + '°';
    $('weatherLoc').textContent = subLabel || CONFIG.city;
  }

  function loadWeather(force) {
    var today = dateKey();
    if (!force) {
      try {
        var cached = JSON.parse(localStorage.getItem(WEATHER_STORE) || 'null');
        if (cached && cached.date === today) { paintWeather(cached.temp, cached.code, cached.label); return; }
      } catch (e) {}
    }
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
      '&current=temperature_2m,weather_code&timezone=Asia%2FSeoul';
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var cur = j && j.current;
      if (!cur || typeof cur.temperature_2m !== 'number') return;
      var label = CONFIG.city + ' · ' + ((WMO[cur.weather_code] || ['', ''])[1] || '');
      paintWeather(cur.temperature_2m, cur.weather_code, label.replace(/ ·\s*$/, ''));
      try {
        localStorage.setItem(WEATHER_STORE, JSON.stringify({ date: today, temp: cur.temperature_2m, code: cur.weather_code, label: label }));
      } catch (e) {}
    }).catch(function () {
      // 오프라인이거나 API가 막히면 지역명만 남긴다
      $('weatherTemp').textContent = CONFIG.city;
      $('weatherLoc').textContent = '';
    });
  }

  /* ───── 미션 ───── */
  function buildMissions() {
    var list = $('missionList');
    list.innerHTML = '';
    DATA.missions.forEach(function (m) {
      var wrap = document.createElement('div');
      wrap.className = 'mission';

      var main = document.createElement('button');
      main.type = 'button';
      main.className = 'mission-main';
      main.setAttribute('aria-pressed', 'false');
      main.innerHTML =
        '<span class="mission-left">' +
          '<span class="check-box"></span>' +
          '<span>' +
            '<span class="mission-name"></span>' +
            '<span class="mission-time"></span>' +
          '</span>' +
        '</span>' +
        '<span class="next-badge">다음</span>' +
        '<span class="stamp">완료!</span>';
      main.querySelector('.mission-name').textContent = m.title;
      main.querySelector('.mission-time').textContent = m.time ? m.time + ' 발행' : '';
      main.addEventListener('click', function () { toggleMission(m.id); });
      wrap.appendChild(main);

      var actions = document.createElement('div');
      actions.className = 'mission-actions';

      if (m.copy_text) {
        var copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'mini-btn copy';
        copyBtn.textContent = '📋 문안 복사';
        copyBtn.setAttribute('aria-label', m.title + ' 문안 복사');
        copyBtn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          copyText(m.copy_text, copyBtn);
        });
        actions.appendChild(copyBtn);
      }

      if (m.app_url) {
        var openLink = document.createElement('a');
        openLink.className = 'mini-btn open';

        openLink.addEventListener('click', function (ev) { ev.stopPropagation(); });
        actions.appendChild(openLink);
      }

      wrap.appendChild(actions);
      list.appendChild(wrap);

  function toggleMission(id) {
    var before = doneCount();
    if (state.done[id]) delete state.done[id];
    else state.done[id] = 1;
    save();
    var after = doneCount();
    renderMissions();
    if (after === DATA.missions.length && before !== after) {
      celebrate();
    } else if (after < DATA.missions.length) {
      toast(progressMessage(after), 2600);
    }
  }

  function doneCount() {
    return DATA.missions.filter(function (m) { return state.done[m.id]; }).length;
  }

  function progressMessage(n) {
    var left = DATA.missions.length - n;
    if (n === 0) return '오늘 미션 ' + DATA.missions.length + '개, 하나씩 체크해 보세요';
    return n + '/' + DATA.missions.length + ' 완료 · ' + left + '개 남았습니다';
  }

  function toMinutes(hhmm) {
    var p = String(hhmm).split(':');
    var h = parseInt(p[0], 10);
    var m = parseInt(p[1], 10);
    if (isNaN(h) || isNaN(m)) return 0;
    return h * 60 + m;
  }

  function renderMissions() {
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var nextId = null;
    DATA.missions.forEach(function (m) {
      if (!state.done[m.id] && nextId === null && toMinutes(m.time) >= nowMin) nextId = m.id;
    });

    var nodes = $('missionList').children;
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var id = el.dataset.id;
      var done = !!state.done[id];
      el.classList.toggle('done', done);
      el.classList.toggle('next', !done && id === nextId);
      var main = el.querySelector('.mission-main');
      if (main) main.setAttribute('aria-pressed', done ? 'true' : 'false');
      var box = el.querySelector('.check-box');
      if (box) box.textContent = done ? '✓' : '';
    }

    var total = DATA.missions.length;
    var n = doneCount();
    $('progText').textContent = n + ' / ' + total + ' 완료';
    $('progFill').style.width = (total ? Math.round((n / total) * 100) : 0) + '%';
  }

  /* ───── 문안 복사 ───── */
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      ta.style.fontSize = '16px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  function copyText(text, btn, opt) {
    opt = opt || {};
    var idleLabel = opt.idle || '📋 문안 복사';
    var okLabel = opt.ok || '✓ 복사됨';
    var okMsg = opt.msg || '📋 문안 복사 완료!';
    var succeed = function () {
      if (btn) {
        btn.classList.add('copied');
        btn.textContent = okLabel;
        setTimeout(function () {
          btn.classList.remove('copied');
          btn.textContent = idleLabel;
        }, 1800);
      }
      toast(okMsg, 2200);
      if (opt.after) opt.after();
    };
    var fail = function () {
      if (legacyCopy(text)) { succeed(); return; }
      toast('복사가 막혔습니다. 새 창에서 문안을 길게 눌러 복사해 주세요', 3400);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(succeed).catch(fail);
    } else {
      fail();
    }
  }

  /* ───── 핵심 체크 ───── */
  function buildChecks() {
    var list = $('checkList');

  function replyItems() {

  function buildReplies() {
    var card = $('replyCard');

  /* ───── 축하 ───── */
  function celebrate() {
    toast('\uD83D\uDE4C 오늘 미션 올클리어! 수고하셨습니다', 6000);
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = $('confetti');
    var colors = ['#3182F6', '#FF7A30', '#16A34A', '#FBBF24', '#EC4899'];

      s.style.opacity = '1';
      box.appendChild(s);
    }
    setTimeout(function () { box.innerHTML = ''; }, 2400);

  /* ───── 토스트 ───── */
  var toastTimer = null;
  function toast(msg, ms) {
    var el = $('toast');
    $('toastText').textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 3000);
  }

  /* ───── 집중 타이머 ───── */
  var timer = { preset: 25, remain: 25 * 60, endAt: 0, running: false, iv: null, audioCtx: null };

  function audioContext() {
    if (timer.audioCtx) {
      if (timer.audioCtx.state === 'suspended') timer.audioCtx.resume();
      return timer.audioCtx;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { timer.audioCtx = new AC(); } catch (e) { return null; }
    return timer.audioCtx;
  }

  // 부드러운 3음 차임 (사인파 + 약한 배음, 긴 감쇠)
  function chime() {
    var ac = audioContext();
    if (!ac) return;
    var t0 = ac.currentTime + 0.02;
    var notes = [880, 1108.73, 1318.51];
    notes.forEach(function (freq, i) {
      var start = t0 + i * 0.19;
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.16, start + 0.10);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.7);
      osc.connect(gain).connect(ac.destination);
      osc.start(start);
      osc.stop(start + 1.8);
    });
  }

  function renderTimer() {
    var s = Math.max(0, timer.remain);
    var mm = Math.floor(s / 60);
    var ss = s % 60;
    $('timerDisplay').textContent = pad(mm) + ':' + pad(ss);
    $('timerDisplay').classList.toggle('ending', timer.running && s <= 10 && s > 0);
    $('timerState').textContent = timer.running ? '집중 중' : (s === 0 ? '완료' : (s < timer.preset * 60 ? '일시정지' : '대기'));
  }

  function setPreset(min) {
    stopTicking();
    timer.preset = min;
    timer.remain = min * 60;
    timer.running = false;
    timer.endAt = 0;
    $('startBtn').textContent = '시작';
    $('startBtn').setAttribute('aria-pressed', 'false');
    var chips = $('presets').children;
    for (var i = 0; i < chips.length; i++) {
      chips[i].classList.toggle('active', parseInt(chips[i].dataset.min, 10) === min);
    }
    renderTimer();
  }

  function stopTicking() {
    if (timer.iv) { clearInterval(timer.iv); timer.iv = null; }
  }

  function tick() {
    if (!timer.running) return;
    var left = Math.round((timer.endAt - Date.now()) / 1000);
    timer.remain = Math.max(0, left);
    renderTimer();
    if (timer.remain <= 0) finishTimer();
  }

  function startTimer() {
    audioContext(); // iOS: 사용자 제스처 안에서 오디오를 미리 깨워둔다
    if (timer.remain <= 0) timer.remain = timer.preset * 60;
    timer.endAt = Date.now() + timer.remain * 1000;
    timer.running = true;
    $('startBtn').textContent = '일시정지';
    $('startBtn').setAttribute('aria-pressed', 'true');
    stopTicking();
    timer.iv = setInterval(tick, 250);
    renderTimer();
  }

  function pauseTimer() {
    timer.remain = Math.max(0, Math.round((timer.endAt - Date.now()) / 1000));
    timer.running = false;
    stopTicking();
    $('startBtn').textContent = '계속';
    $('startBtn').setAttribute('aria-pressed', 'false');
    renderTimer();
  }

  function finishTimer() {
    timer.running = false;
    timer.remain = 0;
    stopTicking();
    $('startBtn').textContent = '다시 시작';
    $('startBtn').setAttribute('aria-pressed', 'false');
    renderTimer();
    chime();
    toast('\u23F0 ' + timer.preset + '분 집중 끝났습니다. 잠깐 쉬어가세요', 5000);
    state.timerEnded = (state.timerEnded || 0) + 1;
    save();
    $('endedCount').textContent = '오늘 ' + state.timerEnded + '회 완료';
  }

  function resetTimer() {
    setPreset(timer.preset);
    toast('타이머를 초기화했습니다', 1800);
  }

  /* ───── 날짜 넘어가면 초기화 ───── */
  function checkRollover() {
    if (state.date !== dateKey()) {
      state = freshState();
      save();
      renderAll();
      loadWeather(true);
      $('endedCount').textContent = '';
      toast('날짜가 바뀌었습니다. 오늘 미션 새로 시작합니다', 3200);
    }
  }

  /* ───── 화면 전체 다시 그리기 ───── */
  function renderAll() {
    renderDate();
    renderBriefing();
    buildMissions();
    buildReplies();
    renderDinner();
    buildBoard();
    buildChecks();
    buildShortcuts();
    renderMissions();
    renderChecks();
  }

  function syncNow(isManual) {
    var btn = $('syncBtn');
    if (isManual) {
      btn.classList.remove('spin');
      void btn.offsetWidth;
      btn.classList.add('spin');
    }
    return loadData(isManual).then(function (clean) {
      if (clean) {
        DATA = clean;
        renderAll();
        if (isManual) toast('🔄 최신 데이터로 동기화했습니다', 2400);
      } else if (!isManual) {
        DATA = FALLBACK;
        renderAll();
      }
      return clean;
    });
  }

  /* ───── 초기화 ───── */
  function init() {
    load();
    renderAll();
    $('endedCount').textContent = state.timerEnded ? '오늘 ' + state.timerEnded + '회 완료' : '';
    setPreset(25);
    loadWeather(false);

    $('startBtn').addEventListener('click', function () {
      if (timer.running) pauseTimer();
      else startTimer();
    });
    $('resetBtn').addEventListener('click', resetTimer);
    var chips = $('presets').children;
    for (var i = 0; i < chips.length; i++) {
      (function (btn) {
        btn.addEventListener('click', function () { setPreset(parseInt(btn.dataset.min, 10)); });
      })(chips[i]);
    }
    $('weather').addEventListener('click', function () { loadWeather(true); });
    $('syncBtn').addEventListener('click', function () { syncNow(true); });
    $('dinnerToggle').addEventListener('click', toggleDinner);
    bindDinnerBox();

    // 실행 시 data.json 을 새로 받아 화면을 다시 그린다 (실패하면 내장 데이터 유지)
    syncNow(false).then(function () {
      if (doneCount() === DATA.missions.length && DATA.missions.length > 0) {
        $('toastText').textContent = '\uD83D\uDE4C 오늘 미션 올클리어! 수고하셨습니다';
      } else {
        $('toastText').textContent = progressMessage(doneCount());
        $('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { $('toast').classList.remove('show'); }, 2800);
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        checkRollover();
        if (timer.running) tick();
        renderMissions(); // '다음' 미션 표시 갱신
        renderDate();
        syncNow(false); // 다시 앱으로 돌아오면 최신 data.json 반영
      }
    });
    setInterval(function () {
      checkRollover();
      if (!timer.running) renderMissions();
    }, 60000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>
